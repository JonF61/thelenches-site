# Cloudflare Worker: approval links, newsletter buttons, unsubscribe, schedule, watchdog,
# admin panel (/admin, behind Cloudflare Access).
# Deployed by .github/workflows/deploy-worker.yml; secrets DISPATCH_TOKEN and
# APPROVAL_SIGNING_KEY are pushed from GitHub secrets at deploy time.
# Admin panel secrets, added by hand in the Cloudflare dashboard as type "Secret" (deploys
# keep secrets but replace plain variables): GOOGLE_SA_KEY, GMAIL_USER, ADMIN_EMAILS,
# ACCESS_TEAM_DOMAIN, ACCESS_AUD. Until all are set, /admin answers 403.
# Reader feedback form (POST /f, public: Cloudflare Access must cover /admin only, never
# /f, /a or /u): Worker secret TURNSTILE_SECRET, added by hand the same way. Until it is
# set, every submission is refused.
# Summary page visitors (admin/visitors.js): secrets CF_ANALYTICS_TOKEN (custom API token,
# Account Analytics: Read only) and CF_ACCOUNT_ID, added by hand the same way.
name = "approvals"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
# 1. Watchdog every 3 hours (UTC).
# 2. Every 30 min on Wed/Thu (UTC): the Worker converts to UK time and fires the
#    digest (Wed 18:30) and newsletter build/auto-send/reminders (Thu 06:30, 08:00,
#    12:00, 17:00). Day NAMES on purpose: Cloudflare numbers days 1=Sunday..7=Saturday,
#    so "3,4" meant Tue/Wed and Thursday never fired (8 Oct 2026).
# 3. 23:10 and 00:10 UTC daily: the Worker keeps whichever is 00:10 UK and fires a
#    site rebuild, so finished events and expired notices drop off overnight.
# 4. Hourly at :00 and :17 (UTC, every day): at :17 the Worker keeps the even UK hours
#    06-22 and fires an ingestion run (GitHub's own cron in ingest.yml ran hours late; it
#    stays as a backup); at :00 it keeps 07:00 UK and fires the daily approvals email.
#    Shared with ingestion so the Worker stays within 5 crons (Cloudflare free limit).
# Keep all strings identical to WATCHDOG_CRON / SCHEDULE_CRON / NIGHTLY_CRON / HOURLY_CRON in src.
crons = ["23 */3 * * *", "0,30 * * * WED,THU", "10 23,0 * * *", "0,17 * * * *"]

[vars]
REPO = "JonF61/thelenches-site"
SITE_URL = "https://thelenches.org.uk/"
# Kill switch for the Wed/Thu schedule: set to "off" and commit to pause it.
SCHEDULE = "on"
# Kill switch for the nightly rebuild: set to "off" and commit to pause it.
NIGHTLY = "on"
# Kill switch for Worker-fired ingestion (GitHub's cron still runs): "off" to pause.
INGEST = "on"
# Kill switch for the 07:00 UK daily approvals email: "off" to pause.
DAILY = "on"
# Lenches Pipeline Sheet, read and written by the admin panel (same ID as the workflows).
SHEET_ID = "1k-9oxqMVfWCb4wIY_RbSiSszarb2d029_UXnKIFdNRI"
# "Lenches Photos" in Drive (same ID as photos.yml): the panel renames and moves photos only
# inside this folder, as the service account (shared on it as Editor).
PHOTOS_FOLDER_ID = "0BwdIG5DOmCgkT2thdWs2LTdIbzQ"

# Reader feedback form: at most 5 submissions a minute per IP address (feedback.js also
# keeps its own 5 per 10 minutes per instance).
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Newsletter sign-up form (signup.js): at most 5 tries a minute per IP address.
[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Anonymous newsletter counts (src/track.js: /c clicks, /o opens), read by the panel's
# Newsletter stats through the SQL API (CF_ANALYTICS_TOKEN, CF_ACCOUNT_ID).
[[analytics_engine_datasets]]
binding = "NL_STATS"
dataset = "lenches_newsletter"

[observability]
enabled = true
