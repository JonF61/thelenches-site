name: Weekly digest

# Wednesday 18:30 UK, fired by the Cloudflare Worker's cron (repository_dispatch
# "digest"): GitHub's own cron ran 6.5h late on 1 Oct 2026. Run workflow kept for manual runs.
on:
  repository_dispatch:
    types: [digest]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Send digest
        run: node scripts/digest/index.js
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          APPROVAL_SIGNING_KEY: ${{ secrets.APPROVAL_SIGNING_KEY }}
          SHEET_ID: 1k-9oxqMVfWCb4wIY_RbSiSszarb2d029_UXnKIFdNRI
          GMAIL_USER: jon@thelenches.org.uk
          DIGEST_TO: jon@thelenches.org.uk
          WORKER_URL: https://approvals.lenches.workers.dev
