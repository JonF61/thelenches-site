name: Weekly digest

# Wednesday 18:30 UK, fired by the Cloudflare Worker's cron (repository_dispatch
# "digest"): GitHub's own cron ran 6.5h late on 1 Oct 2026. Run workflow kept for manual runs.
on:
  repository_dispatch:
    types: [digest]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digest-${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}
  cancel-in-progress: false

env:
  # Which site this run is for (lib/site.js): the dispatch payload's or Run workflow's `site`,
  # else the Lenches (schedules, workflow_run). The Sheet is that site's site.json sheetId
  # (Harvington stage 4, 16 Nov 2026).
  SITE: ${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Send digest
        run: node scripts/digest/index.js
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          APPROVAL_SIGNING_KEY: ${{ secrets.APPROVAL_SIGNING_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          DIGEST_TO: ${{ secrets.GMAIL_USER }}
          WORKER_URL: https://approvals.lenches.workers.dev
