name: Read Sheet tab

# Prints one tab of a site's Pipeline Sheet (input site; default the Lenches) to this log as CSV with row numbers
# (scripts/sheettab). Read-only: spreadsheets.readonly scope. Refuses the Subscribers,
# Do Not Send, Sends, Replies and Feedback tabs, shows only names and roles from Contacts, and masks email addresses elsewhere.
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Which site''s Sheet'
        required: false
        type: choice
        options: [lenches, harvington]
        default: lenches
      tab:
        description: 'Tab name, e.g. Settings'
        required: true
        type: string
      range:
        description: 'Optional range, e.g. A1:F20 (blank = whole tab)'
        required: false
        type: string
        default: ''
      max_rows:
        description: 'Max rows to print (default 50, at most 500)'
        required: false
        type: string
        default: '50'

permissions:
  contents: read

env:
  # Which site this run is for (lib/site.js): the dispatch payload's or Run workflow's `site`,
  # else the Lenches (schedules, workflow_run). The Sheet is that site's site.json sheetId
  # (Harvington stage 4, 16 Nov 2026).
  SITE: ${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Only the script (and the root package files): a full copy takes ~20s for the images.
          sparse-checkout: |
            scripts/sheettab
            lib
            sites/lenches/_data
            sites/harvington/_data
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read tab
        run: node scripts/sheettab/index.js
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          TAB: ${{ inputs.tab }}
          RANGE: ${{ inputs.range }}
          MAX_ROWS: ${{ inputs.max_rows }}
