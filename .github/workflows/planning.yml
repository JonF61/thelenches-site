name: Planning weekly list

# Planning feed (25 Nov 2026, Jon): reads Wychavon's planning weekly list page, parses the newest
# Planning Applications, Decisions Made and Planning Appeals PDFs (scripts/planning, lib/planning.js;
# no Claude) and adds each site's parishes' entries to sites/<site>/_data/planning.json (8 weeks).
# A list already stored is skipped, so a week with no new list commits nothing. Then both sites
# rebuild (their Planning pages and, through the site build, the Newsletter draft).
# 25 Nov 2026: Wychavon's firewall refuses GitHub's runners, so the weekly fetch runs in the
# scheduled Claude session "Kryten: weekly planning lists" (Wednesdays 10:43 UK) instead, and the
# Worker no longer fires this. Kept for manual runs (backfill ticked = every week still on the page)
# in case GitHub's runners are let in again; a blocked run records the problem and succeeds.
on:
  repository_dispatch:
    types: [planning]
  workflow_dispatch:
    inputs:
      backfill:
        description: Read every list still on Wychavon's page (about 4 weeks), not just the newest
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# One run at a time; a newer waiting run replacing an older one is harmless (each reads the page afresh).
concurrency:
  group: planning
  cancel-in-progress: false

jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: pdftotext
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Read Wychavon's lists
        id: read
        run: node scripts/planning/index.js
        env:
          BACKFILL: ${{ github.event.inputs.backfill || 'false' }}
      - name: Commit and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add sites/*/_data/planning.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "Lenches Pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Planning weekly list"
          git pull --rebase
          git push
          gh workflow run build.yml --ref main
          gh workflow run build-harvington.yml --ref main
