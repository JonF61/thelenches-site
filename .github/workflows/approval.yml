name: Apply approval

# Fired by the Cloudflare Worker when an Approve/Reject button is confirmed.
on:
  repository_dispatch:
    types: [approval]

permissions:
  contents: read   # step 5 raises this to write when approvals start publishing

concurrency:
  group: approval
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Record decision
        run: node scripts/approve/index.js
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: 1k-9oxqMVfWCb4wIY_RbSiSszarb2d029_UXnKIFdNRI
          ITEM_ID: ${{ github.event.client_payload.id }}
          ACTION: ${{ github.event.client_payload.action }}
