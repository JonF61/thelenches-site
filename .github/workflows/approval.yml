name: Apply approval

# Fired by the Cloudflare Worker when a button is confirmed:
# approve/reject (Pending items) or send/skip (submitter replies).
on:
  repository_dispatch:
    types: [approval]

# contents/actions write: Add details (action merge) may change a hand-written item in
# sites/<site>/items/, committed below, which then needs the site build (a GITHUB_TOKEN push can't start it).
permissions:
  contents: write
  actions: write

# One queue per item: GitHub keeps only one waiting run per group, so a shared
# group silently cancelled taps made in quick succession (22 Oct).
concurrency:
  group: approval-${{ github.event.client_payload.id }}-${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}
  cancel-in-progress: false

env:
  # Which site this run is for (lib/site.js): the dispatch payload's or Run workflow's `site`,
  # else the Lenches (schedules, workflow_run). The Sheet is that site's site.json sheetId
  # (Harvington stage 4, 16 Nov 2026).
  SITE: ${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Record decision
        run: node scripts/approve/index.js
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          ITEM_ID: ${{ github.event.client_payload.id }}
          ACTION: ${{ github.event.client_payload.action }}
          # Jon's typed reason / edited text are read from the event file by the script, never
          # passed as env: a step's env is printed in the public log (1 Nov).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_OPTIONS: --require ./lib/claudeusage.js
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          # Rimmer reads Holly's redrafts (scripts/rimmer/replycheck.js); RIMMER_REPLIES = off turns it off.
          RIMMER_MODEL: ${{ vars.RIMMER_MODEL }}
          RIMMER_REPLIES: ${{ vars.RIMMER_REPLIES }}
          APPROVAL_SIGNING_KEY: ${{ secrets.APPROVAL_SIGNING_KEY }}
          WORKER_URL: https://approvals.lenches.workers.dev

      - name: Commit item changes (Add details, Replace)
        if: ${{ success() && (github.event.client_payload.action == 'merge' || github.event.client_payload.action == 'replace') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ github.event.client_payload.action == 'replace' && 'Remove a listed item replaced by its organiser''s version (admin panel)' || 'Add details to a listed item (admin panel)' }}
        run: |
          # Every site's items (Add details / Replace may change a shared item on another site, 18 Nov)
          # and this site's item pictures (a replaced item's picture copied from another site).
          for d in sites/*/items sites/*/images/items; do if [ -d "$d" ]; then git add -A "$d"; fi; done
          if git diff --cached --quiet; then echo "No item files changed."; exit 0; fi
          git config user.name "Lenches Pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$SUBJECT"
          git pull --rebase
          git push
          gh workflow run build.yml --ref main
          # Hand-written items are shared by both sites (17 Nov 2026), so rebuild Harvington too.
          gh workflow run build-harvington.yml --ref main
