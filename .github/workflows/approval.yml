name: Apply approval

# Fired by the Cloudflare Worker when a button is confirmed:
# approve/reject (Pending items) or send/skip (submitter replies).
on:
  repository_dispatch:
    types: [approval]

# contents/actions write: Add details (action merge) may change a hand-written item in
# src/items/, committed below, which then needs the site build (a GITHUB_TOKEN push can't start it).
permissions:
  contents: write
  actions: write

# One queue per item: GitHub keeps only one waiting run per group, so a shared
# group silently cancelled taps made in quick succession (22 Oct).
concurrency:
  group: approval-${{ github.event.client_payload.id }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Record decision
        run: node scripts/approve/index.js
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: 1k-9oxqMVfWCb4wIY_RbSiSszarb2d029_UXnKIFdNRI
          GMAIL_USER: jon@thelenches.org.uk
          ITEM_ID: ${{ github.event.client_payload.id }}
          ACTION: ${{ github.event.client_payload.action }}
          # Jon's typed reason / edited text are read from the event file by the script, never
          # passed as env: a step's env is printed in the public log (1 Nov).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_OPTIONS: --require ./lib/claudeusage.js
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          APPROVAL_SIGNING_KEY: ${{ secrets.APPROVAL_SIGNING_KEY }}
          WORKER_URL: https://approvals.lenches.workers.dev

      - name: Commit item changes (Add details)
        if: ${{ success() && github.event.client_payload.action == 'merge' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/items
          if git diff --cached --quiet; then echo "No item files changed."; exit 0; fi
          git config user.name "Lenches Pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add details to a listed item (admin panel)"
          git pull --rebase
          git push
          gh workflow run build.yml --ref main
