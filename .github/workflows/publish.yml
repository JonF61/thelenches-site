name: Publish to site

# Regenerates each site's sites/<site>/_data/pipeline.json (and item images) from approved/auto
# rows in both sites' Pending tabs (Harvington stage 4b). Runs after every approval and every ingestion run, commits only
# if something changed, then starts the site build (a GITHUB_TOKEN push can't).
on:
  workflow_run:
    workflows: ["Apply approval", "Ingest Pipeline label"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # One run publishes both sites (Harvington stage 4b), so one queue.
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Each site: its own Sheet's items for it plus the other Sheet's live items for it
      # (Pending `sites`; blank = both). A site without a sheetId is skipped by the script.
      - name: Generate the Lenches site data
        id: lenches
        run: node scripts/publish/index.js
        env:
          SITE: lenches
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}

      - name: Generate the Harvington site data
        id: harvington
        if: ${{ !cancelled() }}
        run: node scripts/publish/index.js
        env:
          SITE: harvington
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}

      - name: Commit and build
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=""
          for site in lenches harvington; do
            for f in sites/$site/_data/pipeline.json sites/$site/_data/roadgeo.json sites/$site/images; do
              if [ -e "$f" ]; then git add "$f"; fi
            done
            if ! git diff --cached --quiet -- sites/$site; then built="$built $site"; fi
          done
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "Lenches Pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish pipeline items"
          git pull --rebase
          git push
          for site in $built; do
            if [ "$site" = lenches ]; then gh workflow run build.yml --ref main; fi
            if [ "$site" = harvington ]; then gh workflow run build-harvington.yml --ref main; fi
          done
