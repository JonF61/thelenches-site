name: Find listing emails

# Listing address finder (scripts/listingcontacts): for each Local trades / Where to eat entry
# with no address yet, looks on its own website (home page and contact pages) for a public
# email address and saves it to the Org outreach tab (email, email_source "website"), for
# Holly's yearly listing check (admin panel Contacts > Organisations > Listings). It never
# overwrites a cell with a value and sends nothing. The log shows listing ids and counts only.
# listing-suggest.yml runs the same script for each approved suggestion.
on:
  workflow_dispatch:
    inputs:
      id:
        description: One listing id (e.g. trade-john or eat-boot-inn), or all
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: listing-emails-${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}
  cancel-in-progress: false

env:
  # Which site this run is for (lib/site.js): the dispatch payload's or Run workflow's `site`,
  # else the Lenches (schedules, workflow_run). The Sheet is that site's site.json sheetId
  # (Harvington stage 4, 16 Nov 2026).
  SITE: ${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Find addresses
        run: node scripts/listingcontacts/index.js
        env:
          LISTING_ID: ${{ inputs.id }}
