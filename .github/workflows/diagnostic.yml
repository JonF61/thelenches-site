name: Daily diagnostic

on:
  # 05:17 UK every day, fired by the Cloudflare Worker's cron (repository_dispatch
  # "diagnostic"): GitHub's own cron (02:07 UTC) ran about 7.5 hours late (10 Nov).
  # Before Kryten's 05:53 failed-runs check. Run workflow kept for manual runs.
  repository_dispatch:
    types: [diagnostic]
  workflow_dispatch:

permissions:
  contents: read   # the diagnostic never commits with this token
  actions: write   # re-run failed jobs, read job logs, re-enable paused workflows

concurrency:
  group: diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run diagnostic
        run: node scripts/diagnostic/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_OPTIONS: --require ./lib/claudeusage.js
          SHEET_ID: 1k-9oxqMVfWCb4wIY_RbSiSszarb2d029_UXnKIFdNRI
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_LABEL: "Lenches Website/2 Pipeline"
          WORKER_URL: https://approvals.lenches.workers.dev
