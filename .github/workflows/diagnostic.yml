name: Daily diagnostic

on:
  # 05:17 UK every day, fired by the Cloudflare Worker's cron (repository_dispatch
  # "diagnostic"): GitHub's own cron (02:07 UTC) ran about 7.5 hours late (10 Nov).
  # Before Kryten's 05:53 failed-runs check. Run workflow kept for manual runs.
  repository_dispatch:
    types: [diagnostic]
  workflow_dispatch:

permissions:
  contents: read   # the diagnostic never commits with this token
  actions: write   # re-run failed jobs, read job logs, re-enable paused workflows

concurrency:
  group: diagnostic-${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}
  cancel-in-progress: false

env:
  # Which site this run is for (lib/site.js): the dispatch payload's or Run workflow's `site`,
  # else the Lenches (schedules, workflow_run). The Sheet is that site's site.json sheetId
  # (Harvington stage 4, 16 Nov 2026).
  SITE: ${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run diagnostic
        run: node scripts/diagnostic/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_OPTIONS: --require ./lib/claudeusage.js
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          WORKER_URL: https://approvals.lenches.workers.dev
