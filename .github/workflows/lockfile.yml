name: Generate lockfile

# TEMPORARY (step 7F): creates package-lock.json on a runner, since it
# needs network access. Run once, then delete this file.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve dependencies into package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Check the lockfile installs cleanly
        run: npm ci --no-audit --no-fund

      - name: Commit lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "Lenches Pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add package-lock.json (step 7F)"
          git pull --rebase
          git push
