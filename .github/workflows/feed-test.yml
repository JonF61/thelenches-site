name: Feed fetch test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch feeds
        run: |
          cat > t.mjs <<'EOF'
          const urls = [
            'https://www.eveshamjournal.co.uk/news/evesham/rss/',
            'https://harvington-pc.gov.uk/feed',
            'https://www.southlenchesparishcouncil.org/feed/',
          ];
          const uas = {
            node: null,
            custom: 'LenchesPipeline/1.0 (+https://thelenches.org.uk)',
            browser: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36',
          };
          for (const url of urls) {
            console.log(`\n== ${url}`);
            for (const [k, ua] of Object.entries(uas)) {
              try {
                const headers = { Accept: 'application/rss+xml, application/xml;q=0.9, */*;q=0.8' };
                if (ua) headers['User-Agent'] = ua;
                const res = await fetch(url, { headers, redirect: 'follow', signal: AbortSignal.timeout(20000) });
                const text = await res.text();
                const items = (text.match(/<item[\s>]/g) || []).length;
                const first = text.match(/<item[\s\S]*?<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/);
                const date = text.match(/<item[\s\S]*?<pubDate>([\s\S]*?)<\/pubDate>/);
                console.log(`${k.padEnd(8)} ${res.status} ${res.headers.get('content-type')} ${text.length}B items=${items} final=${res.url}`);
                console.log(`         first="${(first?.[1] || '').trim().slice(0, 80)}" date=${date?.[1] || '-'}`);
                if (!items) console.log(`         body: ${text.slice(0, 200).replace(/\s+/g, ' ')}`);
              } catch (e) {
                console.log(`${k.padEnd(8)} ERROR ${e.cause?.code || ''} ${e.message}`);
              }
            }
          }
          EOF
          node t.mjs
