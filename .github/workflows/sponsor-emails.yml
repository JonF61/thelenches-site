name: Find sponsor emails

# Sponsor prospect address finder (scripts/sponsorcontacts): for each Sponsors tab row with a
# blank email, looks on the firm's own website (guessing it from the name when the website
# cell is blank, only if the page names the firm and its town) for a public business address
# and fills the blank cells (email; website and a "guessed" note when it guessed). It never
# overwrites a cell with a value and sends nothing. The log shows row numbers and counts only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sponsor-emails-${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}
  cancel-in-progress: false

env:
  # Which site this run is for (lib/site.js): the dispatch payload's or Run workflow's `site`,
  # else the Lenches (schedules, workflow_run). The Sheet is that site's site.json sheetId
  # (Harvington stage 4, 16 Nov 2026).
  SITE: ${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Find addresses
        run: node scripts/sponsorcontacts/index.js
