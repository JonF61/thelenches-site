name: Deploy approvals Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
      # Bundled into the admin panel's Organisations view (worker/src/admin/index.js).
      - "src/_data/contacts.json"
      - "src/_data/council.json"
      - "src/_data/schools.json"
      - "src/_data/health.json"
      - "src/_data/transport.json"
      # Bundled into the admin panel's Summary page (worker/src/admin/summary.js).
      - "src/_data/onthisday.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          secrets: |
            DISPATCH_TOKEN
            APPROVAL_SIGNING_KEY
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          APPROVAL_SIGNING_KEY: ${{ secrets.APPROVAL_SIGNING_KEY }}
