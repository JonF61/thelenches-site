name: Deploy approvals Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
      # Bundled into the admin panel's Organisations view (worker/src/admin/index.js).
      # Each site's config (worker/src/sites.js).
      - "sites/*/_data/site.json"
      - "sites/*/_data/contacts.json"
      - "sites/*/_data/council.json"
      - "sites/*/_data/schools.json"
      - "sites/*/_data/health.json"
      - "sites/*/_data/transport.json"
      # Bundled into the admin panel's Summary page (worker/src/admin/summary.js).
      - "sites/*/_data/onthisday.json"
      # Bundled so the Recommend buttons only accept listed entries (worker/src/recommend.js),
      # and for the panel's Suggestions cards (worker/src/admin/suggestions.mjs).
      - "sites/*/_data/trades.json"
      - "sites/*/_data/eat.json"
      # Which listing fields the Edit page and the draft editor can change (worker/src/admin/entryedit.js).
      - "lib/entryfields.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

env:
  # Which site this workflow is for (lib/site.js; Harvington stage 2, 16 Nov 2026).
  SITE: lenches

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Deploy first, then upload the secrets: Cloudflare refuses a secret change while
      # the Worker's newest version isn't the deployed one (11 Nov: two failed runs).
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy

      - name: Upload secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          secrets: |
            DISPATCH_TOKEN
            APPROVAL_SIGNING_KEY
          # A command that never looks up a version: `deployments status` raced the
          # new version the secret upload creates (15 Nov: "version could not be found").
          command: --version
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          APPROVAL_SIGNING_KEY: ${{ secrets.APPROVAL_SIGNING_KEY }}
