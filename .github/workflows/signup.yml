name: Newsletter sign-up (web form)

# Fired by the Cloudflare Worker's /s endpoint (repository_dispatch "signup"):
#   action "send"     the form saved a Sign-ups row: email the confirmation link
#   action "confirm"  the reader pressed the link's button: add them to Subscribers
#   action "alert"    (27 Nov 2026) a failed sign-up with an address: email Jon to review it
# The payload is a Sign-ups row id, never an address: this repo's Actions logs are public.
#   Run workflow     (27 Nov 2026, Jon) a one-off reminder to one unconfirmed row: action
#                    "resend" with a fresh link (scripts/signup). Inputs: the row id and site.
#                    Or action "added": add checked failed sign-up rows and email them.
on:
  repository_dispatch:
    types: [signup]
  workflow_dispatch:
    inputs:
      id:
        description: 'Sign-ups row id (e.g. su-20261030-abcdef); for added, several comma separated'
        required: true
      action:
        description: 'resend (a reminder) or added (add a failed sign-up and email them)'
        required: true
        default: resend
      site:
        description: 'Site: lenches or harvington'
        required: true
        default: lenches

permissions:
  contents: read

# One queue per sign-up: a shared group would let a newer run cancel a waiting one.
concurrency:
  group: signup-${{ github.event.client_payload.id }}-${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}
  cancel-in-progress: false

env:
  # Which site this run is for (lib/site.js): the dispatch payload's or Run workflow's `site`,
  # else the Lenches (schedules, workflow_run). The Sheet is that site's site.json sheetId
  # (Harvington stage 4, 16 Nov 2026).
  SITE: ${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}

jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Send confirmation or subscribe
        run: node scripts/signup/index.js
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          APPROVAL_SIGNING_KEY: ${{ secrets.APPROVAL_SIGNING_KEY }}
          WORKER_URL: https://approvals.lenches.workers.dev
          ACTION: ${{ github.event.client_payload.action || (github.event.inputs.id && (github.event.inputs.action == 'added' && 'added' || 'resend')) }}
          SIGNUP_ID: ${{ github.event.client_payload.id || github.event.inputs.id }}
