name: Holly lessons

# Every Monday: Claude reads the past week's corrections in the Reply feedback tab (drafts
# Jon edited, redrafted or rejected with a reason) and proposes a few general lessons for
# Holly. They go in the Holly lessons tab as "proposed" and Jon gets one email with Approve /
# Reject for each (scripts/lessons). Nothing changes until he approves. Logs print counts
# and ids only.
on:
  schedule:
    - cron: "13 7 * * MON"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lessons-${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}
  cancel-in-progress: false

env:
  # Which site this run is for (lib/site.js): the dispatch payload's or Run workflow's `site`,
  # else the Lenches (schedules, workflow_run). The Sheet is that site's site.json sheetId
  # (Harvington stage 4, 16 Nov 2026).
  SITE: ${{ github.event.client_payload.site || github.event.inputs.site || 'lenches' }}

jobs:
  lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Propose lessons
        run: node scripts/lessons/index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_OPTIONS: --require ./lib/claudeusage.js
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          APPROVAL_SIGNING_KEY: ${{ secrets.APPROVAL_SIGNING_KEY }}
          WORKER_URL: https://approvals.lenches.workers.dev
