name: Delete run logs

# Maintenance (1 Nov 2026): deletes the logs of one workflow's runs created before a date,
# e.g. Apply approval runs whose env printed Jon's typed reasons and edited reply text
# (fixed in PR 192). Logs only: the runs stay listed. Dispatched by Kryten on Jon's say-so.
on:
  workflow_dispatch:
    inputs:
      workflow:
        description: 'Workflow file, e.g. approval.yml'
        required: true
        type: string
        default: approval.yml
      before:
        description: 'Delete logs of runs created before this UTC time (ISO, e.g. 2026-11-01T20:30:00Z)'
        required: true
        type: string

permissions:
  actions: write

concurrency:
  group: delete-run-logs
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ inputs.workflow }}
          BEFORE: ${{ inputs.before }}
        run: |
          set -euo pipefail
          [[ "$WF" =~ ^[A-Za-z0-9._-]+\.ya?ml$ ]] || { echo "Bad workflow name"; exit 1; }
          [[ "$BEFORE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+Z$ ]] || { echo "Bad date"; exit 1; }
          ids=$(gh api --paginate "repos/$REPO/actions/workflows/$WF/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.created_at < \"$BEFORE\" and .status == \"completed\") | .id")
          n=0; failed=0
          for id in $ids; do
            if gh api -X DELETE "repos/$REPO/actions/runs/$id/logs" >/dev/null 2>&1; then n=$((n+1)); else failed=$((failed+1)); fi
          done
          echo "Deleted logs of $n run(s) of $WF before $BEFORE; $failed failed (already gone or still running)."
